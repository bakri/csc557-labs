<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSC557 Labs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<style>
  :root { --bg: #f8f9fa; --surface: #fff; --fg: #202124; --muted: #5f6368; --line: #dadce0; --accent: #1a73e8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17181b; --surface: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --accent: #8ab4f8; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 "Roboto", Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-weight: 400; font-size: 32px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.card { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 22px; color: inherit; text-decoration: none; margin-bottom: 12px; }
  a.card:hover { border-color: var(--accent); }
  .wk { color: var(--accent); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
  .t { font-size: 20px; }
</style>
</head>
<body>
<main>
  <h1>CSC557 Mobile Programming</h1>
  <p>Lab worksheets</p>
  <a class="card" href="week4/"><div class="wk">Week 4</div><div class="t">Android UI Lab: Designing Layouts</div></a>
  <a class="card" href="week5/"><div class="wk">Week 5</div><div class="t">Android Activity Lab: Activities, Intents and Fragments</div></a>
</main>
</body>
</html>
